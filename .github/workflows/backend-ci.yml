name: DIAM-YARAAM Backend CI

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'release/**'

  pull_request:
    branches:
      - develop
      - main
      - 'release/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Build & Tests Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du repository
        uses: actions/checkout@v7

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Installer Maven 3.9.6
        shell: bash
        run: |
          curl -fsSL \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.6/apache-maven-3.9.6-bin.tar.gz \
            -o "$RUNNER_TEMP/maven.tar.gz"

          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/apache-maven-3.9.6/bin" >> "$GITHUB_PATH"

      - name: Vérifier Java et Maven
        run: |
          java -version
          mvn -version

      - name: Build et tests
        run: |
          mvn --batch-mode --no-transfer-progress clean verify