# =====================================================
# API GATEWAY — Port 8080
# Point d'entrée unique pour tous les clients
# =====================================================

spring.application.name=api-gateway
server.port=8090

# ----- Eureka -----
eureka.client.service-url.defaultZone=http://admin:admin123@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ----- JWT (validation centralisée) -----
jwt.secret=diam-yaraam-super-secret-key-2026-at-least-256-bits-for-hs256

# ----- ROUTES — Routage vers les microservices -----
# Le Gateway utilise le Service Discovery (lb:// = load balanced via Eureka)
# Chaque route intercepte un préfixe d'URL et le redirige vers le bon service.
# Le filtre StripPrefix=1 enlève le préfixe /api/auth avant d'envoyer au service.

# AUTH SERVICE — Routes publiques (pas de JWT requis)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# MEDECIN SERVICE
spring.cloud.gateway.routes[1].id=medecin-service
spring.cloud.gateway.routes[1].uri=lb://medecin-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/medecins/**,/api/admin/onms/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# PATIENT SERVICE
spring.cloud.gateway.routes[2].id=patient-service
spring.cloud.gateway.routes[2].uri=lb://patient-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/patients/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# DOSSIER SERVICE
spring.cloud.gateway.routes[3].id=dossier-service
spring.cloud.gateway.routes[3].uri=lb://dossier-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/dossiers/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

# RDV SERVICE
spring.cloud.gateway.routes[4].id=rdv-service
spring.cloud.gateway.routes[4].uri=lb://rdv-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/rdv/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

# NOTIFICATION SERVICE
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=lb://notification-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=1

# WALLET SERVICE
spring.cloud.gateway.routes[6].id=wallet-service
spring.cloud.gateway.routes[6].uri=lb://wallet-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/wallet/**,/api/portefeuilles/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=1

# IA SERVICE (Python FastAPI - port 8089)
spring.cloud.gateway.routes[7].id=ia-service
spring.cloud.gateway.routes[7].uri=http://127.0.0.1:8089
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/ia/**
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=1

# ----- CORS -----
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# Déduplication des en-têtes CORS
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

management.endpoints.web.exposure.include=health,info,gateway

logging.level.org.springframework.cloud.gateway=DEBUG

