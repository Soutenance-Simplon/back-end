# =====================================================
# AUTH SERVICE — Port 8081
# Schéma PostgreSQL : auth_schema
# =====================================================

spring.application.name=auth-service
server.port=8081

# ----- Base de données -----
# Un seul PostgreSQL, schéma dédié : auth_schema
# Chaque service a son propre schéma → isolation des données
spring.datasource.url=jdbc:postgresql://localhost:5432/diam_yaraam?currentSchema=auth_schema
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Crée le schéma s'il n'existe pas
spring.jpa.properties.hibernate.default_schema=auth_schema

# ----- Eureka Client -----
# S'enregistre auprès du discovery-server
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
eureka.instance.prefer-ip-address=true

# ----- JWT -----
# Clé secrète injectée via la variable d'environnement JWT_SECRET
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
# 86400000 ms = 24 heures

# ----- Sécurité & CORS -----
# Désactiver la sécurité basique Spring (on gère nous-mêmes avec JWT)
spring.security.user.name=unused
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8088,http://localhost:3000}
otp.bypass.enabled=${OTP_BYPASS_ENABLED:false}
otp.bypass.code=${OTP_BYPASS_CODE:456321}

# ----- Actuator (health check pour Eureka) -----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ----- Règles métier -----
# RM027 : OTP valide 5 minutes
otp.validity-minutes=5
# RM028 : Max 5 tentatives
otp.max-attempts=5
# RM024 : Blocage après N tentatives de connexion
auth.max-login-attempts=5
# Durée du blocage en minutes
auth.lockout-duration-minutes=15

logging.level.com.diamyaraam.auth=DEBUG

# ----- Meta WhatsApp Cloud API -----
# Active l'envoi direct d'OTP via le réseau WhatsApp officiel
whatsapp.api.enabled=true
whatsapp.api.url=https://graph.facebook.com/v19.0
whatsapp.api.phone-number-id=
whatsapp.api.token=

