# ============================================================
# DIAM-YARAAM — Orchestration Docker Compose
# Architecture microservices complète (PostgreSQL, Eureka,
# Microservices Spring Boot, Service IA FastAPI, API Gateway)
# ============================================================

name: diam-yaraam

services:

  # ----------------------------------------------------------
  # 1. BASE DE DONNEES POSTGRESQL (Socle persistant)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: diam-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diam_yaraam}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-diam_yaraam}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - diam-network

  # ----------------------------------------------------------
  # 2. DISCOVERY SERVER (Service Discovery Eureka)
  # ----------------------------------------------------------
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: diam-discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - diam-network

  # ----------------------------------------------------------
  # 3. SERVICE IA (Python / FastAPI / RAG Clinique)
  # ----------------------------------------------------------
  ia-service:
    build:
      context: ./ia-service
      dockerfile: Dockerfile
    container_name: diam-ia-service
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      IA_SERVICE_PORT: 8089
      DOCUMENTS_PATH: /app/documents
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088,http://localhost:3000}
    volumes:
      - ./documents:/app/documents:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, os; urllib.request.urlopen('http://localhost:' + os.getenv('IA_SERVICE_PORT', '8089') + '/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - diam-network

  # ----------------------------------------------------------
  # 4. AUTH SERVICE (Authentification & Gestion des Rôles)
  # ----------------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: diam-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/diam_yaraam?currentSchema=auth_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088,http://localhost:3000}
      OTP_BYPASS_ENABLED: ${OTP_BYPASS_ENABLED:-false}
      OTP_BYPASS_CODE: ${OTP_BYPASS_CODE:-456321}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - diam-network

  # ----------------------------------------------------------
  # 5. PATIENT SERVICE (Dossier & Profils Patients)
  # ----------------------------------------------------------
  patient-service:
    build:
      context: .
      dockerfile: patient-service/Dockerfile
    container_name: diam-patient-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/diam_yaraam?currentSchema=patient_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - diam-network

  # ----------------------------------------------------------
  # 6. MEDECIN SERVICE (Ordre des Médecins ONDMS & Spécialistes)
  # ----------------------------------------------------------
  medecin-service:
    build:
      context: .
      dockerfile: medecin-service/Dockerfile
    container_name: diam-medecin-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/diam_yaraam?currentSchema=medecin_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - diam-network

  # ----------------------------------------------------------
  # 7. RDV SERVICE (Rendez-vous, WebSocket STOMP, LiveKit)
  # ----------------------------------------------------------
  rdv-service:
    build:
      context: .
      dockerfile: rdv-service/Dockerfile
    container_name: diam-rdv-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/diam_yaraam?currentSchema=rdv_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - diam-network

  # ----------------------------------------------------------
  # 8. DOSSIER SERVICE (Dossiers Médicaux & Carte Pass Vital)
  # ----------------------------------------------------------
  dossier-service:
    build:
      context: .
      dockerfile: dossier-service/Dockerfile
    container_name: diam-dossier-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/diam_yaraam?currentSchema=dossier_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      WS_BROADCAST_URL: http://rdv-service:8084/ws-broadcast
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rdv-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - diam-network

  # ----------------------------------------------------------
  # 9. NOTIFICATION SERVICE (Alertes & Notifications)
  # ----------------------------------------------------------
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: diam-notification-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/diam_yaraam?currentSchema=notification_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      WS_BROADCAST_URL: http://rdv-service:8084/ws-broadcast
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rdv-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - diam-network

  # ----------------------------------------------------------
  # 10. WALLET SERVICE (Portefeuille & Paiements)
  # ----------------------------------------------------------
  wallet-service:
    build:
      context: .
      dockerfile: wallet-service/Dockerfile
    container_name: diam-wallet-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/diam_yaraam?currentSchema=wallet_schema
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      WS_BROADCAST_URL: http://rdv-service:8084/ws-broadcast
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rdv-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - diam-network

  # ----------------------------------------------------------
  # 11. API GATEWAY (Point d'Entrée Unique & Routage Intelligent)
  # ----------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: diam-api-gateway
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      IA_SERVICE_URL: http://ia-service:8089
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088,http://localhost:3000}
    depends_on:
      discovery-server:
        condition: service_healthy
      ia-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - diam-network

  # ----------------------------------------------------------
  # 12. ADMIN DASHBOARD (Portail Administrateur Vue 3 / Vite)
  # ----------------------------------------------------------
  admin-dashboard:
    build:
      context: ../admin-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8090/api
    container_name: diam-admin-dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - diam-network

  # ----------------------------------------------------------
  # 13. FRONTEND WEB (Application Patient & Médecin Flutter Web)
  # ----------------------------------------------------------
  frontend-web:
    build:
      context: ../frontendl3-master
      dockerfile: ${FLUTTER_DOCKERFILE:-Dockerfile.prebuilt}
    container_name: diam-frontend-web
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - diam-network

# ============================================================
# RESEAUX ET VOLUMES
# ============================================================
networks:
  diam-network:
    name: diam-network
    driver: bridge

volumes:
  postgres_data:
    name: diam_postgres_data
